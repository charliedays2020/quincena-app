name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar Capacitor al sitio
        run: cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ajustar firma, versión y permisos
        run: node scripts/patch-android.js

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk Quincena-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quincena-apk
          path: Quincena-*.apk
